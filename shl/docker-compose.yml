services:
  shl-agent:
    build: .
    container_name: agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http:add here"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
